<form [formGroup]="taskForm" (ngSubmit)="onSubmit()"
    class="task-form max-w-4xl mx-auto bg-white p-4 sm:p-6 rounded-lg shadow" action="">
    <div class="field space-y-1">
        <label for="task" class="text-sm font-semibold text-slate-700">Title</label>
        <textarea id="task" rows="3"
            class="w-full p-3 rounded-md border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-400 transition"
            formControlName="task"></textarea>
    </div>

    <div class="row flex flex-col sm:flex-row gap-4">
        <div class="field w-full sm:w-1/2">
            <label for="priority" class="text-sm font-semibold text-slate-700 mb-1 block">Priority</label>
            <select id="priority" name="priority"
                class="w-full p-2 rounded-md border border-slate-200 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-400"
                formControlName="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <div class="field w-full sm:w-1/2">
            <label for="status" class="text-sm font-semibold text-slate-700 mb-1 block">Status</label>
            <select id="status" name="status"
                class="w-full p-2 rounded-md border border-slate-200 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-400"
                formControlName="status">
                <option value="Todo">Todo</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
    </div>

    <div class="actions mt-4 flex justify-end">
        <button type="submit"
            class="primary inline-flex items-center justify-center px-4 py-2 rounded-md text-white font-semibold bg-gradient-to-r from-teal-400 to-sky-500 hover:from-teal-500 hover:to-sky-600 shadow-md transition transform hover:-translate-y-0.5">Add
            Task</button>
    </div>
</form>
